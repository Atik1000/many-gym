<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ManyGym · Chat</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#15171c; --mut:#6b7280; --line:#e6e8ec;
    --pri:#7a5cff; --pri600:#6a4af0; --pri50:#efeaff; --ok:#2fbf71; --bad:#e5484d;
    --me:#7a5cff; --them:#eef0f3;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px}
  input{font:inherit}
  .hidden{display:none !important}

  /* ---- login ---- */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .logo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:24px;font-weight:800;margin-bottom:22px}
  .logo .m{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:19px;background:linear-gradient(135deg,#8f73ff,var(--pri600))}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 10px 40px rgba(20,23,28,.06)}
  .card h1{margin:0 0 4px;font-size:21px}
  .card p.sub{margin:0 0 20px;color:var(--mut);font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  .in{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
  .in:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri50)}
  .btn{width:100%;padding:12px;background:var(--pri);color:#fff;font-weight:700;margin-top:20px;transition:background .15s}
  .btn:hover{background:var(--pri600)} .btn:disabled{opacity:.6;cursor:default}
  .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:1px}
  .foot{margin-top:16px;text-align:center;color:var(--mut);font-size:13px}

  /* ---- app ---- */
  #app{height:100vh;display:flex;flex-direction:column}
  .top{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line)}
  .top .m{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,#8f73ff,var(--pri600))}
  .top b{font-size:16px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mut)}
  .dot.on{background:var(--ok)} .dot.mid{background:#f0b429} .dot.off{background:var(--bad)}
  .top .me{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:14px}
  .lnk{color:var(--pri);font-weight:600;background:none;padding:6px 8px}
  .wrap{flex:1 1 auto;display:grid;grid-template-columns:320px 1fr;min-height:0}
  .list{border-right:1px solid var(--line);background:var(--card);overflow:auto;display:flex;flex-direction:column}
  .list .h{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .list .h b{font-size:15px}
  .newbtn{background:var(--pri50);color:var(--pri600);font-weight:700;padding:6px 11px;border-radius:9px;font-size:13px}
  .conv{display:flex;gap:11px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
  .conv:hover{background:#fafafe} .conv.active{background:var(--pri50)}
  .av{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:700;background:#b9a7ff}
  .conv .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .pv{color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .badge{background:var(--pri);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
  .empty{padding:28px 16px;color:var(--mut);font-size:14px;text-align:center}

  .pane{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
  .phead{height:58px;flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line)}
  .phead .nm{font-weight:700}
  .phead .st{color:var(--mut);font-size:12px}
  .msgs{flex:1 1 auto;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:7px}
  .b{max-width:66%;padding:9px 13px;border-radius:15px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;position:relative}
  .b.me{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:5px}
  .b.them{align-self:flex-start;background:var(--them);color:var(--ink);border-bottom-left-radius:5px}
  .b.lock{align-self:flex-start;background:#fff7e6;color:#8a6d1a;font-style:italic;border:1px solid #f3e2b8}
  .b .ts{display:block;font-size:10px;opacity:.65;margin-top:3px;text-align:right}
  .typing{align-self:flex-start;color:var(--mut);font-size:13px;padding:4px 6px}
  .welcome{margin:auto;color:var(--mut);text-align:center;max-width:300px}
  .composer{flex:0 0 auto;display:flex;gap:10px;align-items:flex-end;padding:12px 16px;background:var(--card);border-top:1px solid var(--line)}
  .composer textarea{flex:1 1 auto;resize:none;height:44px;max-height:130px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;outline:none;font:inherit}
  .composer textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri50)}
  .send{background:var(--pri);color:#fff;font-weight:700;padding:0 18px;height:44px;border-radius:12px}
  .send:hover{background:var(--pri600)} .send:disabled{opacity:.5;cursor:default}

  /* ---- new-chat sheet ---- */
  .sheet{position:fixed;inset:0;background:rgba(20,23,28,.4);display:grid;place-items:center;padding:20px;z-index:20}
  .sheet .box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:400px}
  .sheet h3{margin:0 0 4px} .sheet p{margin:0 0 14px;color:var(--mut);font-size:13px}
  .seg{display:flex;gap:8px;margin-bottom:12px}
  .seg button{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:600;color:var(--mut)}
  .seg button.on{background:var(--pri50);border-color:transparent;color:var(--pri600)}
  .rowbtns{display:flex;gap:8px;margin-top:16px}
  .rowbtns .ghost{flex:1;background:#f1f1f5;color:var(--ink);padding:11px;font-weight:600}
  .rowbtns .go{flex:1;background:var(--pri);color:#fff;padding:11px;font-weight:700}
  @media(max-width:720px){ .wrap{grid-template-columns:1fr} .list{display:var(--mobileList,flex)} }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div>
    <div class="logo"><span class="m">m</span>manygym</div>
    <form class="card" id="loginForm">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to message your gym.</p>
      <label for="email">Email</label>
      <input id="email" class="in" type="email" autocomplete="username" required />
      <label for="pw">Password</label>
      <input id="pw" class="in" type="password" autocomplete="current-password" required />
      <button class="btn" id="loginBtn" type="submit">Sign in</button>
      <div class="err" id="loginErr"></div>
      <div class="foot">End-to-end encrypted · your messages stay private</div>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <div class="top">
    <span class="m">m</span><b>Chat</b>
    <span class="dot off" id="dot" title="connection"></span>
    <span class="me"><span id="meName"></span><button class="lnk" id="logout">Sign out</button></span>
  </div>
  <div class="wrap">
    <div class="list">
      <div class="h"><b>Chats</b><button class="newbtn" id="newBtn">+ New</button></div>
      <div id="convs"></div>
      <div class="empty hidden" id="convEmpty">No chats yet.<br/>Tap “+ New” to message a gym.</div>
    </div>
    <div class="pane">
      <div class="phead hidden" id="phead"><span class="av" id="pav"></span><div><div class="nm" id="pnm"></div><div class="st" id="pst"></div></div></div>
      <div class="msgs" id="msgs"><div class="welcome">Pick a chat on the left, or start a new one.</div></div>
      <div class="typing hidden" id="typing"></div>
      <div class="composer hidden" id="composer">
        <textarea id="input" placeholder="Type a message…" rows="1"></textarea>
        <button class="send" id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- new chat sheet -->
<div class="sheet hidden" id="sheet">
  <div class="box">
    <h3>Start a new chat</h3>
    <p>Enter the ID of the gym (or person) you want to message.</p>
    <div class="seg"><button class="on" id="segGym">A gym</button><button id="segUser">A person</button></div>
    <input id="targetId" class="in" placeholder="gym id (uuid)" />
    <div class="rowbtns"><button class="ghost" id="sheetCancel">Cancel</button><button class="go" id="sheetGo">Start chat</button></div>
    <div class="err" id="sheetErr"></div>
  </div>
</div>

<script>
const API='https://v0.manygym.com/api/v1';
const WSB='wss://v0.manygym.com/ws/chat/';
const DEVKEY='manygym.user.device.v1';
const TOKKEY='manygym.user.tokens.v1';

/* ---------- crypto (same scheme as the ManyGym app) ---------- */
const sc=crypto.subtle, te=new TextEncoder(), td=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const HKDF={name:'HKDF',hash:'SHA-256',salt:te.encode('ManyGym-E2EE-v1'),info:te.encode('ManyGym-DirectMessaging')};
async function fp(b){const h=await sc.digest('SHA-256',unb64(b));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16);}
async function loadDevice(){
  let d=null; try{d=JSON.parse(localStorage.getItem(DEVKEY)||'null')}catch{}
  if(d&&d.idPrivJwk){ D.priv=await sc.importKey('jwk',d.idPrivJwk,{name:'X25519'},false,['deriveBits']); D.pub=d.identityPub; D.id=d.deviceId; D.spkPub=d.spkPub; D.spkSig=d.spkSig; return; }
  const id=await sc.generateKey({name:'X25519'},true,['deriveBits']);
  const spk=await sc.generateKey({name:'X25519'},true,['deriveBits']);
  const ed=await sc.generateKey({name:'Ed25519'},true,['sign','verify']);
  const spkRaw=new Uint8Array(await sc.exportKey('raw',spk.publicKey));
  const sig=b64(await sc.sign({name:'Ed25519'},ed.privateKey,spkRaw));
  D.priv=id.privateKey; D.pub=b64(await sc.exportKey('raw',id.publicKey)); D.id=crypto.randomUUID(); D.spkPub=b64(spkRaw); D.spkSig=sig;
  localStorage.setItem(DEVKEY,JSON.stringify({deviceId:D.id,identityPub:D.pub,idPrivJwk:await sc.exportKey('jwk',id.privateKey),spkPub:D.spkPub,spkSig:D.spkSig}));
}
async function sessionKey(peerB64){const peer=await sc.importKey('raw',unb64(peerB64),{name:'X25519'},false,[]);
  const sh=await sc.deriveBits({name:'X25519',public:peer},D.priv,256);const base=await sc.importKey('raw',sh,'HKDF',false,['deriveKey']);
  return sc.deriveKey(HKDF,base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(text,peerB64){const key=await sessionKey(peerB64);const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await sc.encrypt({name:'AES-GCM',iv},key,te.encode(text));
  return{ciphertext:b64(ct),nonce:b64(iv),ephemeral_public_key:D.pub,recipient_key_fingerprint:await fp(peerB64)};}
async function openMsg(ct,nonce,peerB64){try{const key=await sessionKey(peerB64);return td.decode(await sc.decrypt({name:'AES-GCM',iv:unb64(nonce)},key,unb64(ct)));}catch{return null;}}
function pickKey(devs){for(let i=(devs||[]).length-1;i>=0;i--){const k=devs[i].identity_key;try{if(k&&unb64(k).length===32)return k;}catch{}}return null;}

/* ---------- state ---------- */
const D={priv:null,pub:null,id:null,spkPub:null,spkSig:null};
const S={tok:null,refresh:null,me:null,meName:'',convs:[],active:null,peerKey:null,ws:null,hb:null,backoff:0,seen:new Set(),pending:[],typingTimer:null,lastType:0,segType:'gym'};
const $=s=>document.querySelector(s);

/* ---------- api with auto-refresh ---------- */
async function api(path,opt={}){
  const doFetch=async()=>{const h=Object.assign({'Content-Type':'application/json'},opt.headers||{});
    if(S.tok&&!opt.anon)h.Authorization='Bearer '+S.tok;
    return fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined});};
  let r=await doFetch();
  if(r.status===401&&S.refresh&&!opt.anon&&!opt._retry){
    const rr=await fetch(API+'/auth/token/refresh/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh:S.refresh})});
    if(rr.ok){const rb=await rr.json(); if(rb.access){S.tok=rb.access; if(rb.refresh)S.refresh=rb.refresh; saveTokens(); r=await doFetch();}}
  }
  let b=null; try{b=await r.json()}catch{}
  if(!r.ok)throw new Error((b&&(b.message||b.detail||(b.details&&b.details.detail)))||('HTTP '+r.status));
  return b;
}
function saveTokens(){try{localStorage.setItem(TOKKEY,JSON.stringify({access:S.tok,refresh:S.refresh}))}catch{}}

/* ---------- login ---------- */
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); const btn=$('#loginBtn'); $('#loginErr').textContent='';
  btn.disabled=true; btn.textContent='Signing in…';
  try{
    const email=$('#email').value.trim(), pw=$('#pw').value;
    const r=await api('/auth/login/',{method:'POST',anon:true,body:{email,password:pw}});
    S.tok=r.tokens.access; S.refresh=r.tokens.refresh; saveTokens();
    const me=await api('/auth/me/'); S.me=me.user.id; S.meName=(me.user.first_name||'')+' '+(me.user.last_name||'');
    await startApp();
  }catch(err){ $('#loginErr').textContent=err.message||'Could not sign in'; }
  finally{ btn.disabled=false; btn.textContent='Sign in'; }
});

async function startApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#meName').textContent=S.meName.trim()||'Me';
  await loadDevice(); await ensureRegistered();
  connect(); await loadConvs();
}
async function ensureRegistered(){
  try{const bundle=await api('/messaging/keys/user/'+S.me+'/');
    const has=(bundle.devices||[]).some(d=>d.device_id===D.id);
    if(!has) await registerDevice();
  }catch{ await registerDevice(); }
}
async function registerDevice(){
  try{await api('/messaging/keys/register/',{method:'POST',body:{device_id:D.id,device_name:'Web chat',identity_key:D.pub,signed_prekey:D.spkPub,signed_prekey_signature:D.spkSig,one_time_prekeys:[]}});}catch(e){}
}

/* ---------- conversations ---------- */
function initials(n){return (n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';}
function peerOf(c){
  const op=c.other_party||{};
  if(op.name||op.id)return{name:op.name||'Conversation',type:op.type,userId:op.type==='user'?op.id:op.user_id,gymId:op.type==='gym'?op.id:op.gym_id};
  let uid=null,gid=null;
  if(c.user_a&&c.user_a!==S.me)uid=c.user_a; else if(c.user_b&&c.user_b!==S.me)uid=c.user_b;
  if(c.gym_a)gid=c.gym_a; else if(c.gym_b)gid=c.gym_b;
  return{name:(c.conversation_type||'').replace(/_/g,' '),userId:uid,gymId:gid};
}
async function loadConvs(){
  try{ S.convs=await api('/messaging/conversations/'); renderConvs(); }catch(e){}
}
function renderConvs(){
  const box=$('#convs'); box.innerHTML='';
  $('#convEmpty').classList.toggle('hidden',S.convs.length>0);
  S.convs.forEach(c=>{
    const p=peerOf(c); const el=document.createElement('div'); el.className='conv'+(S.active&&S.active.id===c.id?' active':'');
    el.innerHTML=`<div class="av">${initials(p.name)}</div><div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="pv">${esc(c.last_message_preview||'Encrypted chat')}</div></div><div class="meta">${c.unread_count?`<span class="badge">${c.unread_count}</span>`:''}</div>`;
    el.onclick=()=>openConv(c); box.appendChild(el);
  });
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

async function openConv(c){
  S.active=c; S.peerKey=null; S.seen.clear(); S.pending=[]; renderConvs();
  const p=peerOf(c);
  $('#phead').classList.remove('hidden'); $('#composer').classList.remove('hidden');
  $('#pav').textContent=initials(p.name); $('#pnm').textContent=p.name; $('#pst').textContent='End-to-end encrypted';
  $('#msgs').innerHTML='<div class="welcome">Loading…</div>';
  // fetch peer key
  try{ let bundle;
    if(p.userId)bundle=await api('/messaging/keys/user/'+p.userId+'/');
    else if(p.gymId)bundle=await api('/messaging/keys/gym/'+p.gymId+'/');
    S.peerKey=bundle?pickKey(bundle.devices):null;
    $('#pst').textContent=S.peerKey?'End-to-end encrypted':'Waiting for the other side to set up encryption';
  }catch{ $('#pst').textContent='Could not load encryption key'; }
  // join room
  wsSend({action:'join_conversation',conversation_id:c.id});
  // history
  await loadHistory(c.id);
  // mark read
  wsSend({action:'mark_read',conversation_id:c.id});
  c.unread_count=0; renderConvs();
}
async function loadHistory(cid){
  $('#msgs').innerHTML='';
  try{const msgs=await api('/messaging/conversations/'+cid+'/messages/');
    for(const m of msgs){ if(m.id)S.seen.add(m.id);
      const mine=m.sender_user_id===S.me;
      const txt=(m.ciphertext&&m.nonce&&S.peerKey)?await openMsg(m.ciphertext,m.nonce,S.peerKey):null;
      addBubble(txt,mine,m.sent_at,txt===null&&m.ciphertext);
    }
    if(!msgs.length)$('#msgs').innerHTML='<div class="welcome">No messages yet — say hello 👋</div>';
  }catch(e){}
  scrollEnd();
}
function addBubble(text,mine,at,locked){
  const w=$('#msgs'); const wel=w.querySelector('.welcome'); if(wel)wel.remove();
  const d=document.createElement('div');
  if(locked){d.className='b lock';d.textContent='🔒 Encrypted with a different key';}
  else{d.className='b '+(mine?'me':'them');d.textContent=text==null?'🔒':text;}
  if(at){const t=document.createElement('span');t.className='ts';t.textContent=(at+'').slice(11,16);d.appendChild(t);}
  w.appendChild(d); scrollEnd(); return d;
}
function scrollEnd(){const w=$('#msgs');w.scrollTop=w.scrollHeight;}

/* ---------- send ---------- */
async function send(){
  const ta=$('#input'); const text=ta.value.trim(); if(!text||!S.active)return;
  if(!S.peerKey){alert('The other side hasn’t set up encryption yet.');return;}
  ta.value=''; autoGrow();
  const tmp='tmp-'+crypto.randomUUID(); S.pending.push(tmp);
  const el=addBubble(text,true,new Date().toISOString(),false); el.dataset.tmp=tmp;
  try{ const sealed=await seal(text,S.peerKey);
    const payload={conversation_id:S.active.id,...sealed,sender_type:'user',sender_device_id:D.id,encrypted_keys:{}};
    const ok=wsSend({action:'send_message',...payload});
    if(!ok){ await api('/messaging/conversations/'+S.active.id+'/messages/',{method:'POST',body:payload}); }
  }catch(e){ el.style.opacity=.5; }
}
$('#sendBtn').onclick=send;
const input=$('#input');
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
input.addEventListener('input',()=>{ autoGrow(); sendTyping(); });
function autoGrow(){input.style.height='44px';input.style.height=Math.min(130,input.scrollHeight)+'px';}
function sendTyping(){ if(!S.active)return; const now=Date.now();
  if(now-S.lastType>2000){S.lastType=now; wsSend({action:'typing',conversation_id:S.active.id,is_typing:true});}
  clearTimeout(S.typingTimer); S.typingTimer=setTimeout(()=>wsSend({action:'typing',conversation_id:S.active.id,is_typing:false}),2500);
}

/* ---------- websocket w/ auto-reconnect ---------- */
function setDot(c){$('#dot').className='dot '+c;}
function wsSend(o){ if(!S.ws||S.ws.readyState!==1)return false; try{S.ws.send(JSON.stringify(o));return true;}catch{return false;} }
function connect(){
  setDot('mid');
  const p=new URLSearchParams({token:S.tok});
  let ws; try{ws=new WebSocket(WSB+'?'+p.toString());}catch{return scheduleReconnect();}
  S.ws=ws;
  ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return}
    if(m.type==='connection_established'){ setDot('on'); S.backoff=0;
      if(S.active)wsSend({action:'join_conversation',conversation_id:S.active.id});
      clearInterval(S.hb); S.hb=setInterval(()=>wsSend({action:'ping'}),12000); return; }
    if(m.type==='new_message'||m.type==='incoming_notification'){ await onIncoming(m.message); return; }
    if(m.type==='message_sent_ack'){ reconcile(m); return; }
    if(m.type==='typing_indicator'){ const d=m.data||{}; if(S.active&&d.conversation_id===S.active.id&&d.user_id!==S.me){ showTyping(d.is_typing,d.sender_name); } return; }
  };
  ws.onclose=()=>{ clearInterval(S.hb); S.ws=null; setDot('off'); scheduleReconnect(); };
  ws.onerror=()=>{};
}
function scheduleReconnect(){ const delay=Math.min(15000,1000*Math.pow(2,S.backoff))*(0.8+Math.random()*0.4); S.backoff++; setDot('mid'); setTimeout(connect,delay); }
let typingHide=null;
function showTyping(on,name){ const t=$('#typing'); if(on){t.textContent=(name||'They')+' is typing…';t.classList.remove('hidden');clearTimeout(typingHide);typingHide=setTimeout(()=>t.classList.add('hidden'),3500);} else {t.classList.add('hidden');} }
function reconcile(m){ const el=[...document.querySelectorAll('.b.me')].find(x=>x.dataset.tmp&&x.dataset.tmp===S.pending[0]);
  if(el){el.dataset.tmp='';S.pending.shift(); if(m.message_id)S.seen.add(m.message_id);} }
async function onIncoming(w){
  if(!w)return; const cid=w.conversation_id;
  if(w.id&&S.seen.has(w.id))return;
  const mine=w.sender_user_id===S.me;
  if(S.active&&cid===S.active.id){
    if(w.id)S.seen.add(w.id);
    if(mine&&S.pending.length){ const el=[...document.querySelectorAll('.b.me')].find(x=>x.dataset.tmp===S.pending[0]); if(el){el.dataset.tmp='';S.pending.shift(); return;} }
    const txt=(w.ciphertext&&w.nonce&&S.peerKey)?await openMsg(w.ciphertext,w.nonce,S.peerKey):null;
    addBubble(txt,mine,w.sent_at,txt===null&&w.ciphertext);
    if(!mine)wsSend({action:'mark_read',conversation_id:cid});
  } else {
    const c=S.convs.find(x=>x.id===cid); if(c){c.unread_count=(c.unread_count||0)+1; c.last_message_preview='New message'; renderConvs();}
    else { await loadConvs(); }
  }
}

/* ---------- new chat ---------- */
$('#newBtn').onclick=()=>{ $('#sheet').classList.remove('hidden'); $('#sheetErr').textContent=''; $('#targetId').value=''; };
$('#sheetCancel').onclick=()=>$('#sheet').classList.add('hidden');
$('#segGym').onclick=()=>{S.segType='gym';$('#segGym').classList.add('on');$('#segUser').classList.remove('on');$('#targetId').placeholder='gym id (uuid)';};
$('#segUser').onclick=()=>{S.segType='user';$('#segUser').classList.add('on');$('#segGym').classList.remove('on');$('#targetId').placeholder='user id (uuid)';};
$('#sheetGo').onclick=async()=>{
  const id=$('#targetId').value.trim(); if(!id){$('#sheetErr').textContent='Enter an id';return;}
  try{ const body=S.segType==='gym'?{conversation_type:'user_to_gym',source_gym_id:id,target_gym_id:id}:{conversation_type:'user_to_user',target_user_id:id};
    const c=await api('/messaging/conversations/',{method:'POST',body});
    $('#sheet').classList.add('hidden'); await loadConvs();
    const full=S.convs.find(x=>x.id===c.id)||c; openConv(full);
  }catch(e){ $('#sheetErr').textContent=e.message; }
};

/* ---------- logout / resume ---------- */
$('#logout').onclick=()=>{ try{localStorage.removeItem(TOKKEY)}catch{}; location.reload(); };
(async()=>{ // resume session if a token is stored
  try{const t=JSON.parse(localStorage.getItem(TOKKEY)||'null'); if(t&&t.access){ S.tok=t.access; S.refresh=t.refresh;
    const me=await api('/auth/me/'); S.me=me.user.id; S.meName=(me.user.first_name||'')+' '+(me.user.last_name||''); await startApp(); }}catch{ try{localStorage.removeItem(TOKKEY)}catch{} }
})();
</script>
