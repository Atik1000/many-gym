$kind: http-example
name: '400 Bad Request'
request:
  url: '{{base_url}}/api/v1/users/me/'
  method: PATCH
response:
  statusCode: 400
  statusText: 'Bad Request'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "VALIDATION_ERROR",
        "message": "Validation failure on updated profile values.",
        "details": {
          "field_name": [
            "This field is required."
          ]
        }
      }
