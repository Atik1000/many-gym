$kind: http-request
name: 'List Reposts of a Post'
method: GET
url: '{{base_url}}/api/v1/posts/:post_id/reposts/'
order: 16000
description: |-
  Retrieves visible profile reposts referencing the specified post ID.
pathVariables:
  - key: post_id
    value: '00000000-0000-0000-0000-000000000000'
queryParams:
  - key: page
    value: ''
    description: 'A page number within the paginated result set.'
    disabled: true
  - key: page_size
    value: ''
    description: 'Number of results to return per page.'
    disabled: true
examples: './.resources/GET List Reposts of a Post.resources/examples'
