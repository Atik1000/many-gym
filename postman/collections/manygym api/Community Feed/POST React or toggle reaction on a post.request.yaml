$kind: http-request
name: 'React or toggle reaction on a post'
method: POST
url: '{{base_url}}/api/v1/posts/:post_id/reactions/'
order: 12000
description: |-
  Creates, updates, or toggles off a reaction on a community post/repost.
pathVariables:
  - key: post_id
    value: '00000000-0000-0000-0000-000000000000'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reaction_item_id": "00000000-0000-0000-0000-000000000000",
      "reaction_code": "string",
      "owner_type": "user",
      "gym_id": "00000000-0000-0000-0000-000000000000",
      "post_id": "00000000-0000-0000-0000-000000000000",
      "story_id": "00000000-0000-0000-0000-000000000000",
      "comment_id": "00000000-0000-0000-0000-000000000000"
    }
examples: './.resources/POST React or toggle reaction on a post.resources/examples'
