$kind: http-request
name: 'Create Community Post'
method: POST
url: '{{base_url}}/api/v1/posts/?gym_id={{gym_id}}'
order: 2000
queryParams:
  - key: gym_id
    value: '{{gym_id}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "content_text": "string",
      "privacy": "public",
      "media_items": [
        {
          "media_url": "string",
          "media_type": "picture",
          "thumbnail_url": "string",
          "file_size_bytes": 1,
          "order_index": 1
        }
      ]
    }
examples: './.resources/POST Create Community Post.resources/examples'
