$kind: http-request
name: 'Remove reaction from a post'
method: DELETE
url: '{{base_url}}/api/v1/posts/:post_id/reactions/'
order: 13000
description: |-
  Explicitly removes the authenticated user's reaction from the specified post.
pathVariables:
  - key: post_id
    value: '00000000-0000-0000-0000-000000000000'
examples: './.resources/DELETE Remove reaction from a post.resources/examples'
