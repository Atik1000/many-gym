        "category": "gym_profile",
        "category_display": "string",
        "details": "string",
        "target_type": "string",
        "target_id": "00000000-0000-0000-0000-000000000000",
        "metadata": "string",
        "date_and_time": "2026-01-01T09:00:00Z",
        "formatted_date_time": "string"
      }
