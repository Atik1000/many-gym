$kind: http-example
name: '201'
request:
  url: '{{base_url}}/api/v1/routine-templates/?gym_id={{gym_id}}'
  method: POST
response:
  statusCode: 201
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: application/json
