$kind: http-example
name: '200'
request:
  url: '{{base_url}}/api/v1/routine-templates/:template_id/?gym_id={{gym_id}}'
  method: GET
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "template_name": "Example name",
        "routine_format": "weekly",
        "level": "beginner",
        "notes": "string"
      }
