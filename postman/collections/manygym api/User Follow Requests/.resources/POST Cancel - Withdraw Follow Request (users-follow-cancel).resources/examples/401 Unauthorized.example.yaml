$kind: http-example
name: '401 Unauthorized'
request:
  url: '{{base_url}}/api/v1/users/:user_id/follow/cancel/'
  method: POST
response:
  statusCode: 401
  statusText: 'Unauthorized'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "AUTHENTICATION_REQUIRED",
        "message": "Authentication required.",
        "details": {}
      }
