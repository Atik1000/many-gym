$kind: http-request
name: 'Unblock a User'
method: DELETE
url: '{{base_url}}/api/v1/gyms/settings/blocked-users/:user_id/?gym_id={{gym_id}}'
order: 4000
pathVariables:
  - key: user_id
    value: '{{user_id}}'
queryParams:
