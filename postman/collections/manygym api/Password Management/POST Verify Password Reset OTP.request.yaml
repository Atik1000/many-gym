$kind: http-request
name: 'Verify Password Reset OTP'
method: POST
url: '{{base_url}}/api/v1/auth/verify-reset-otp/'
order: 4000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "person@example.com",
      "otp_code": "123456"
    }
examples: './.resources/POST Verify Password Reset OTP.resources/examples'
