$kind: http-request
name: 'Reset Password with OTP'
method: POST
url: '{{base_url}}/api/v1/auth/reset-password/'
order: 3000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "person@example.com",
      "otp_code": "123456",
      "new_password": "SuperSecret123!"
    }
examples: './.resources/POST Reset Password with OTP.resources/examples'
