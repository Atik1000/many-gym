$kind: http-request
name: 'Change Password'
method: POST
url: '{{base_url}}/api/v1/users/change-password/'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "SuperSecret123!",
      "new_password": "SuperSecret123!"
    }
examples: './.resources/POST Change Password 2.resources/examples'
