$kind: http-request
name: 'Request Password Reset OTP'
method: POST
url: '{{base_url}}/api/v1/auth/forgot-password/'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "person@example.com"
    }
examples: './.resources/POST Request Password Reset OTP.resources/examples'
