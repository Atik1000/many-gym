$kind: http-example
name: '200'
request:
  url: '{{base_url}}/api/v1/leads/metrics/?gym_id={{gym_id}}'
  method: GET
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "total_leads": 1,
        "new": 1,
        "contacted": 1,
        "visit_trial_booked": 1,
        "joined": 1,
        "not_joining": 1,
        "conversion_rate_percentage": 1,
        "pending_next_moves_count": 1
      }
