$kind: http-request
name: 'Get story reactions summary'
method: GET
url: '{{base_url}}/api/v1/reactions/stories/:story_id/summary/'
order: 15000
description: |-
  Returns total reactions, emoji frequency breakdown, and viewer reaction for a story.
pathVariables:
  - key: story_id
    value: '00000000-0000-0000-0000-000000000000'
examples: './.resources/GET Get story reactions summary.resources/examples'
