    {
      "reaction_item_id": "00000000-0000-0000-0000-000000000000",
      "reaction_code": "string",
      "owner_type": "user",
      "gym_id": "00000000-0000-0000-0000-000000000000",
      "post_id": "00000000-0000-0000-0000-000000000000",
      "story_id": "00000000-0000-0000-0000-000000000000",
      "comment_id": "00000000-0000-0000-0000-000000000000"
    }
examples: './.resources/POST React or toggle reaction on a story.resources/examples'
