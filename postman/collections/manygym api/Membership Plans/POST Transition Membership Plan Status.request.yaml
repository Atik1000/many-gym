$kind: http-request
name: 'Transition Membership Plan Status'
method: POST
url: '{{base_url}}/api/v1/plans/:plan_id/status/'
order: 8000
pathVariables:
  - key: plan_id
    value: '00000000-0000-0000-0000-000000000000'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "plan_status": "draft"
    }
examples: './.resources/POST Transition Membership Plan Status.resources/examples'
