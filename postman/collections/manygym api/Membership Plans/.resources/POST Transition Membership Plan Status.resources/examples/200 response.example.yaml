$kind: http-example
name: '200'
request:
  url: '{{base_url}}/api/v1/plans/:plan_id/status/'
  method: POST
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Example name",
        "description": "string",
        "plan_status": "draft",
        "plan_type": "time_based",
        "price": "1500.00",
        "duration_value": 1,
        "duration_unit": "day",
        "joining_fee": "1500.00",
        "payment_schedule": "full_payment",
        "cancellation_policy": "string",
        "refund_policy": "string"
      }
