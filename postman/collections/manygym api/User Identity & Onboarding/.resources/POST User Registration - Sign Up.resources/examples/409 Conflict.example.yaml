$kind: http-example
name: '409 Conflict'
request:
  url: '{{base_url}}/api/v1/auth/register/'
  method: POST
response:
  statusCode: 409
  statusText: 'Conflict'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "CONFLICT",
        "message": "An account with this email already exists.",
        "details": {}
      }
