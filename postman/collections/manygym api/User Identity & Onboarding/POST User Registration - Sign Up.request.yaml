$kind: http-request
name: 'User Registration / Sign Up'
method: POST
url: '{{base_url}}/api/v1/auth/register/'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "person@example.com",
      "password": "SuperSecret123!",
      "first_name": "Example name",
      "last_name": "Example name",
      "phone": "+8801700000000"
    }
examples: './.resources/POST User Registration - Sign Up.resources/examples'
