$kind: http-example
name: '400 Bad Request'
request:
  url: '{{base_url}}/api/v1/auth/:user_id/follow/'
  method: POST
response:
  statusCode: 400
  statusText: 'Bad Request'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "VALIDATION_ERROR",
        "message": "Invalid request (e.g. self-follow).",
        "details": {
          "field_name": [
            "This field is required."
          ]
        }
      }
