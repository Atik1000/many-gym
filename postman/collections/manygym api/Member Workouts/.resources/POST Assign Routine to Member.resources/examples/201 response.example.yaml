$kind: http-example
name: '201'
request:
  url: '{{base_url}}/api/v1/members/:member_id/routines/assign/?gym_id={{gym_id}}'
  method: POST
response:
  statusCode: 201
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "routine_name": "Example name",
        "routine_format": "weekly",
        "level": "beginner",
        "is_active": true,
        "notes": "string",
        "assigned_at": "2026-01-01T09:00:00Z"
      }
