$kind: http-example
name: '401 Unauthorized'
request:
  url: '{{base_url}}/api/v1/comments/:comment_id/'
  method: PATCH
response:
  statusCode: 401
  statusText: 'Unauthorized'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "AUTHENTICATION_REQUIRED",
        "message": "Unauthorized.",
        "details": {}
      }
