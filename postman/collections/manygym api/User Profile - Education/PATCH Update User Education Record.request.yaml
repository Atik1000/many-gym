$kind: http-request
name: 'Update User Education Record'
method: PATCH
url: '{{base_url}}/api/v1/users/profile/about/educations/:education_id/'
order: 3000
description: |-
  API endpoint for updating or deleting an individual education record.
pathVariables:
  - key: education_id
    value: '00000000-0000-0000-0000-000000000000'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "id": "00000000-0000-0000-0000-000000000000",
      "university_name": "Example name",
      "from_year": "2026-01-01",
      "till_year": "2026-01-01",
      "subject": "string",
      "graduated": false
    }
examples: './.resources/PATCH Update User Education Record.resources/examples'
