$kind: http-request
name: 'Update an Enquiry'
method: PATCH
url: '{{base_url}}/api/v1/enquiries/:enquiry_id/'
order: 5000
description: |-
  Updates fields of an existing enquiry (status, type, summary, contact info, notes). Staff only.
pathVariables:
  - key: enquiry_id
    value: '00000000-0000-0000-0000-000000000000'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "first_name": "Example name",
      "last_name": "Example name",
      "email": "person@example.com",
      "phone": "+8801700000000",
      "gym_id": "00000000-0000-0000-0000-000000000000",
      "manygym_user_id": "00000000-0000-0000-0000-000000000000",
      "type": "string",
      "status": "string",
      "summary": "string",
      "notes": [
        "string"
      ],
      "append_note": "string"
    }
examples: './.resources/PATCH Update an Enquiry.resources/examples'
