$kind: http-request
name: 'Change Password'
method: POST
url: '{{base_url}}/api/v1/users/settings/security/change-password/'
order: 12000
description: |-
  ### Summary
  Changes account password for the logged-in user after verifying current password.
  
  ### Request Body
  - `current_password` (required): Current account password.
  - `new_password` (required): New password (at least 8 characters).
  - `confirm_password` (optional): Confirmation password matching new password.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "{{password}}",
      "new_password": "{{password}}",
      "confirm_password": "{{password}}"
    }
examples: './.resources/POST Change Password (users-settings-security-change-password).resources/examples'
