$kind: http-example
name: '200 Device removed and keys cleaned successfully.'
request:
  url: '{{base_url}}/api/v1/auth/settings/security/devices/:device_id/'
  method: DELETE
response:
  statusCode: 200
  statusText: 'Device removed and keys cleaned successfully.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
