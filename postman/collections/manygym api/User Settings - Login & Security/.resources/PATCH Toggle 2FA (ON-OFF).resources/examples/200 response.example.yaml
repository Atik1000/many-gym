$kind: http-example
name: '200 2FA status updated.'
request:
  url: '{{base_url}}/api/v1/auth/settings/security/2fa/'
  method: PATCH
response:
  statusCode: 200
  statusText: '2FA status updated.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "two_factor_enabled": false
      }
