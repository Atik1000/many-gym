$kind: http-example
name: '200 Contact information updated successfully.'
request:
  url: '{{base_url}}/api/v1/auth/settings/security/contact-info/'
  method: PATCH
response:
  statusCode: 200
  statusText: 'Contact information updated successfully.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "primary_email": "person@example.com",
        "secondary_email": "person@example.com",
        "phone": "+8801700000000"
      }
