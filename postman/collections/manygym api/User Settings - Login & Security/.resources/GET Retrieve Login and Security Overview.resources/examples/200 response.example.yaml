$kind: http-example
name: '200 Security settings overview retrieved successfully.'
request:
  url: '{{base_url}}/api/v1/auth/settings/security/'
  method: GET
response:
  statusCode: 200
  statusText: 'Security settings overview retrieved successfully.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "contact_info": {
          "primary_email": "person@example.com",
          "secondary_email": "person@example.com",
          "phone": "+8801700000000"
        },
        "two_factor_enabled": false,
        "logged_in_devices_count": 1,
        "max_devices": 0,
        "account_status": {}
      }
