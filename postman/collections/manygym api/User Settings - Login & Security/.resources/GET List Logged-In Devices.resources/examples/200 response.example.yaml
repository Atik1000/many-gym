$kind: http-example
name: '200 Logged-in devices list retrieved.'
request:
  url: '{{base_url}}/api/v1/auth/settings/security/devices/'
  method: GET
response:
  statusCode: 200
  statusText: 'Logged-in devices list retrieved.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      [
        {
          "id": "00000000-0000-0000-0000-000000000000",
          "device_id": "00000000-0000-0000-0000-000000000000",
          "device_name": "Example name",
          "ip_address": "string",
          "user_agent": "string",
          "last_login": "2026-01-01T09:00:00Z",
          "created_at": "2026-01-01T09:00:00Z",
          "is_current_device": false
        }
      ]
