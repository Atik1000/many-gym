$kind: http-request
name: 'Toggle 2FA (ON/OFF)'
method: PATCH
url: '{{base_url}}/api/v1/users/settings/security/2fa/'
order: 11000
description: |-
  ### Summary
  Enables or disables Two Factor Authentication for the account.
  When ON, subsequent logins will require a 6-digit OTP code dispatched via fallback:
  Primary Email -> Secondary Email -> Phone SMS.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "two_factor_enabled": false
    }
examples: './.resources/PATCH Toggle 2FA (ON-OFF) (users-settings-security-2fa).resources/examples'
