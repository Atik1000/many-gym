$kind: http-example
name: '201'
request:
  url: '{{base_url}}/api/v1/members/subscriptions/:subscription_id/payments/'
  method: POST
response:
  statusCode: 201
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "amount": "1500.00",
        "payment_method": "cash",
        "payment_date": "2026-01-01",
        "is_initial_payment": true,
        "notes": "string"
      }
