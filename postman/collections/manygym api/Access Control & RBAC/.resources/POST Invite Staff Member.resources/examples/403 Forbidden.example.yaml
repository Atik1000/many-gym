$kind: http-example
name: '403 Forbidden'
request:
  url: '{{base_url}}/api/v1/access-control/staff/'
  method: POST
response:
  statusCode: 403
  statusText: 'Forbidden'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "PERMISSION_DENIED",
        "message": "Permission denied (requires people_roles:manage).",
        "details": {}
      }
