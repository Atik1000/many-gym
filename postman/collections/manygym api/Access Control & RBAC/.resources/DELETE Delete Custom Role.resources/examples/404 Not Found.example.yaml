$kind: http-example
name: '404 Not Found'
request:
  url: '{{base_url}}/api/v1/access-control/roles/:role_id/'
  method: DELETE
response:
  statusCode: 404
  statusText: 'Not Found'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "RESOURCE_NOT_FOUND",
        "message": "Role not found.",
        "details": {}
      }
