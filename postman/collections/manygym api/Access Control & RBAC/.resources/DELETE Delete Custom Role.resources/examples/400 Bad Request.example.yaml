$kind: http-example
name: '400 Bad Request'
request:
  url: '{{base_url}}/api/v1/access-control/roles/:role_id/'
  method: DELETE
response:
  statusCode: 400
  statusText: 'Bad Request'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "VALIDATION_ERROR",
        "message": "Cannot delete active assigned role.",
        "details": {
          "field_name": [
            "This field is required."
          ]
        }
      }
