$kind: http-example
name: '200 Custom role updated.'
request:
  url: '{{base_url}}/api/v1/access-control/roles/:role_id/'
  method: PATCH
response:
  statusCode: 200
  statusText: 'Custom role updated.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Example name",
        "slug": "string",
        "is_custom": true,
        "description": "string"
      }
