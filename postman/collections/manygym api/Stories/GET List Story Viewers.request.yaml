$kind: http-request
name: 'List Story Viewers'
method: GET
url: '{{base_url}}/api/v1/stories/:story_id/viewers/'
order: 13000
description: |-
  Retrieves users who viewed this story. Restricted to the story owner or authorized gym staff.
pathVariables:
  - key: story_id
    value: '00000000-0000-0000-0000-000000000000'
queryParams:
  - key: page
    value: ''
    description: 'A page number within the paginated result set.'
    disabled: true
  - key: page_size
    value: ''
    description: 'Number of results to return per page.'
    disabled: true
examples: './.resources/GET List Story Viewers.resources/examples'
