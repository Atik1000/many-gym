$kind: http-request
name: 'Get Story Detail'
method: GET
url: '{{base_url}}/api/v1/stories/:story_id/'
order: 5000
description: |-
  Retrieves a single story. Pass ?mark_viewed=true (when authenticated) to record a view.
pathVariables:
  - key: story_id
    value: '00000000-0000-0000-0000-000000000000'
queryParams:
  - key: mark_viewed
    value: ''
    disabled: true
examples: './.resources/GET Get Story Detail.resources/examples'
