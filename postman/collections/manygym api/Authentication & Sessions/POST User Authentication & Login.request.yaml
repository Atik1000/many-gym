$kind: http-request
name: 'User Authentication & Login'
method: POST
url: '{{base_url}}/api/v1/auth/login/'
order: 1000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "person@example.com",
      "password": "SuperSecret123!"
    }
examples: './.resources/POST User Authentication & Login.resources/examples'
