$kind: http-request
name: 'Verify 2FA OTP Code'
method: POST
url: '{{base_url}}/api/v1/auth/verify-2fa/'
order: 7000
description: |-
  ### Summary
  Validates submitted 2FA OTP code. Upon successful verification:
  - Registers/updates active logged-in device (enforcing max 5 devices limit).
  - Issues JWT personal access and refresh tokens.
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "person@example.com",
      "otp_code": "123456",
      "device_id": "00000000-0000-0000-0000-000000000000",
      "device_name": "Example name"
    }
examples: './.resources/POST Verify 2FA OTP Code.resources/examples'
