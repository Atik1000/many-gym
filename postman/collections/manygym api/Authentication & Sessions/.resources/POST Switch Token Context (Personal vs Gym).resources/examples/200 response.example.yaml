$kind: http-example
name: '200 Context switched; newly scoped token issued.'
request:
  url: '{{base_url}}/api/v1/auth/switch-context/'
  method: POST
response:
  statusCode: 200
  statusText: 'Context switched; newly scoped token issued.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "string",
        "tokens": {
          "access": "string",
          "refresh": "string",
          "context_type": "string",
          "gym_id": "00000000-0000-0000-0000-000000000000",
          "gym_name": "Example name",
          "scopes": [
            "string"
          ]
        }
      }
