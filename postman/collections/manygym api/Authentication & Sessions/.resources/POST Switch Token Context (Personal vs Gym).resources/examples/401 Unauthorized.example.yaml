$kind: http-example
name: '401 Unauthorized'
request:
  url: '{{base_url}}/api/v1/auth/switch-context/'
  method: POST
response:
  statusCode: 401
  statusText: 'Unauthorized'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "AUTHENTICATION_REQUIRED",
        "message": "User does not have access rights to the requested gym.",
        "details": {
          "detail": "Authentication credentials were not provided."
        }
      }
