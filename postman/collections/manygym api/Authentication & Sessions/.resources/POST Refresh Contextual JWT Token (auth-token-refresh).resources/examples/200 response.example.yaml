$kind: http-example
name: '200 Token refreshed successfully; fresh session pair issued.'
request:
  url: '{{base_url}}/api/v1/auth/token/refresh/'
  method: POST
response:
  statusCode: 200
  statusText: 'Token refreshed successfully; fresh session pair issued.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "message": "string",
        "tokens": {
          "access": "{{access_token}}",
          "refresh": "{{refresh_token}}",
          "context_type": "string",
          "gym_id": "00000000-0000-0000-0000-000000000000",
          "gym_name": "Example name",
          "scopes": [
            "string"
          ]
        }
      }
