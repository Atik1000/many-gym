$kind: http-request
name: 'Update Gym Settings'
method: PATCH
url: '{{base_url}}/api/v1/gyms/settings/?gym_id={{gym_id}}'
order: 2000
queryParams:
  - key: gym_id
    value: '{{gym_id}}'
    description: 'Target Gym UUID if not using a gym context JWT token.'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "language": "string",
      "video_autoplay": true,
      "dark_mode": true,
      "admin_logs_alerts": true,
      "issues_alerts": true,
      "who_can_message": "everyone",
      "who_can_send_joining_request": "everyone",
      "who_can_see_members": "everyone",
      "who_can_see_followers": "everyone",
      "who_can_see_following": "everyone",
      "posts_age_restriction": "any_age",
      "is_deactivated": true,
      "is_published": true,
      "is_deleted": true
    }
examples: './.resources/PATCH Update Gym Settings.resources/examples'
