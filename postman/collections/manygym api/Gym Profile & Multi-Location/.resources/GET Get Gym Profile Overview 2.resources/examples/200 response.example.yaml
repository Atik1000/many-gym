$kind: http-example
name: '200 Gym profile details.'
request:
  url: '{{base_url}}/api/v1/gyms/profile/overview/?gym_id={{gym_id}}'
  method: GET
response:
  statusCode: 200
  statusText: 'Gym profile details.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "name": "Example name",
        "profile_picture_url": "string",
        "cover_photo_url": "string",
        "short_description": "string",
        "primary_type": "general_fitness_gym",
        "secondary_type": "general_fitness_gym",
        "gender_required": "everyone",
        "min_age": -2147483648,
        "timezone": "string"
      }
