$kind: http-example
name: '200 Location data.'
request:
  url: '{{base_url}}/api/v1/gyms/profile/location/?gym_id={{gym_id}}'
  method: GET
response:
  statusCode: 200
  statusText: 'Location data.'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "address": "string",
        "latitude": "string",
        "longitude": "string",
        "city": "string",
        "country": "string",
        "postal_code": "string",
        "is_primary": true
      }
