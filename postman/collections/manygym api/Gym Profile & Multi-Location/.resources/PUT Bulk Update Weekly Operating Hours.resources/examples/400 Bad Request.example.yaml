$kind: http-example
name: '400 Bad Request'
request:
  url: '{{base_url}}/api/v1/gyms/opening-hours/?gym_id={{gym_id}}'
  method: PUT
response:
  statusCode: 400
  statusText: 'Bad Request'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "VALIDATION_ERROR",
        "message": "Time validation failure.",
        "details": {
          "field_name": [
            "This field is required."
          ]
        }
      }
