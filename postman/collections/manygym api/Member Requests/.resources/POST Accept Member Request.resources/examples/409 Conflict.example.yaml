$kind: http-example
name: '409 Conflict'
request:
  url: '{{base_url}}/api/v1/gyms/:gym_id/member-requests/:request_id/accept/?gym_id={{gym_id}}'
  method: POST
response:
  statusCode: 409
  statusText: 'Conflict'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "RESOURCE_CONFLICT",
        "message": "Request already processed or user already a member.",
        "details": {}
      }
