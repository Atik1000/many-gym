$kind: http-example
name: '409 Conflict'
request:
  url: '{{base_url}}/api/v1/members/requests/:request_id/cancel/'
  method: POST
response:
  statusCode: 409
  statusText: 'Conflict'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "code": "RESOURCE_CONFLICT",
        "message": "Cannot cancel non-pending request.",
        "details": {}
      }
